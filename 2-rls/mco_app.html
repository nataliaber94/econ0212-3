<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moindres carrés interactifs</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f5f6f8; --text: #1d2330; --muted: #5d6675;
    --grid: #e4e7ec; --axis: #9aa3b0; --point: #2f5fb3; --line: #1d2330;
    --bad: #c8372d; --good: #1f8a4c; --ols: #7a52c7; --border: #d6dae1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16191f; --panel: #1f242c; --text: #e8ebf0; --muted: #a2abb8;
      --grid: #2b313b; --axis: #5d6675; --point: #6d9bf0; --line: #e8ebf0;
      --bad: #f06a5f; --good: #4cc47f; --ols: #b394f0; --border: #353c47;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16191f; --panel: #1f242c; --text: #e8ebf0; --muted: #a2abb8;
    --grid: #2b313b; --axis: #5d6675; --point: #6d9bf0; --line: #e8ebf0;
    --bad: #f06a5f; --good: #4cc47f; --ols: #b394f0; --border: #353c47;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif; }
  .app { display: grid; grid-template-columns: 300px 1fr; gap: 20px;
    padding: 16px; max-width: 1100px; margin: 0 auto; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; line-height: 1.35; }
  label.sl { display: flex; justify-content: space-between; font-size: 16px;
    font-weight: 600; margin-top: 10px; }
  label.sl span.v { font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 6px 0 2px; accent-color: var(--point); }
  .eq { font-size: 17px; margin: 14px 0 6px; font-variant-numeric: tabular-nums; }
  .sse { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--bad); }
  .sse.good { color: var(--good); }
  .msg { font-size: 14px; min-height: 38px; margin-top: 4px; line-height: 1.35; }
  .meter { height: 10px; background: var(--grid); border-radius: 5px;
    overflow: hidden; margin: 8px 0 2px; }
  .meter > div { height: 100%; background: var(--bad); width: 0; transition: width .15s; }
  .meter.good > div { background: var(--good); }
  .meterlab { font-size: 12px; color: var(--muted); }
  .checks { margin-top: 14px; display: grid; gap: 6px; font-size: 15px; }
  .checks label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .olsbox { margin-top: 10px; font-size: 14px; color: var(--ols);
    font-variant-numeric: tabular-nums; line-height: 1.45; }
  button { margin-top: 12px; font: inherit; font-size: 14px; padding: 6px 12px;
    border-radius: 6px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); cursor: pointer; }
  .plot { width: 100%; }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--muted); font-size: 12px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <h1>Ajustez la droite</h1>
    <p class="sub">Choisissez b<sub>0</sub> et b<sub>1</sub> pour rendre la somme des carrés des résidus (SCR) la plus petite possible.</p>

    <label class="sl" for="b0"><span>Ordonnée à l'origine b<sub>0</sub></span> <span class="v" id="b0v"></span></label>
    <input type="range" id="b0" min="-40" max="40" step="1" value="5">

    <label class="sl" for="b1"><span>Pente b<sub>1</sub></span> <span class="v" id="b1v"></span></label>
    <input type="range" id="b1" min="-20" max="20" step="1" value="-10">

    <div class="eq" id="eq"></div>
    <div>SCR = <span class="sse" id="sse"></span></div>
    <div class="meter" id="meter"><div></div></div>
    <div class="meterlab" id="meterlab"></div>
    <div class="msg" id="msg"></div>

    <div class="checks">
      <label><input type="checkbox" id="showSq" checked> Afficher les carrés des résidus</label>
      <label><input type="checkbox" id="showOls"> Afficher la droite MCO</label>
    </div>
    <div class="olsbox" id="olsbox" hidden></div>
    <button id="reset">Réinitialiser</button>
  </div>
  <div class="plot"><svg id="plot" role="img" aria-label="Nuage de points et droite choisie"></svg></div>
</div>

<script>
(function () {
  // ---- Data: fixed pseudo-random sample, y = -2 + 1.5 x + u, n = 20 ----
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) >>> 0; let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(42);
  const norm = () => { const u = 1 - rng(), v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const n = 20, X = [], Y = [];
  for (let i = 0; i < n; i++) X.push(2 + 4 * norm());
  // Noise made orthogonal to 1 and x, so that the OLS line is exactly y = -2 + 1.5 x
  const U = []; for (let i = 0; i < n; i++) U.push(norm());
  { const mX = X.reduce((s, v) => s + v, 0) / n, mU = U.reduce((s, v) => s + v, 0) / n;
    let sxu = 0, sxx0 = 0;
    for (let i = 0; i < n; i++) { sxu += (X[i] - mX) * (U[i] - mU); sxx0 += (X[i] - mX) ** 2; }
    const g = sxu / sxx0;
    for (let i = 0; i < n; i++) U[i] = U[i] - mU - g * (X[i] - mX); }
  for (let i = 0; i < n; i++) Y.push(-2 + 1.5 * X[i] + U[i]);

  const sse = (a, b) => { let s = 0;
    for (let i = 0; i < n; i++) { const e = Y[i] - a - b * X[i]; s += e * e; } return s; };

  // Exact OLS
  const mx = X.reduce((s, v) => s + v, 0) / n, my = Y.reduce((s, v) => s + v, 0) / n;
  let sxy = 0, sxx = 0;
  for (let i = 0; i < n; i++) { sxy += (X[i] - mx) * (Y[i] - my); sxx += (X[i] - mx) ** 2; }
  const bOls = sxy / sxx, aOls = my - bOls * mx, sseOls = sse(aOls, bOls);

  // Minimum SSE over the slider grid (steps of 0.1): this is what "green" means
  const A0 = -40, A1 = 40, B0 = -20, B1 = 20;
  let gridMin = Infinity;
  for (let i = A0; i <= A1; i++) for (let j = B0; j <= B1; j++) {
    const s = sse(i / 10, j / 10); if (s < gridMin) gridMin = s; }
  let sseMax = Math.max(sse(0.5, -1), sse(-4, -2), sse(4, 2), sse(4, -2), sse(-4, 2));

  // ---- Plot geometry: equal scale on both axes so squares are squares ----
  const pad = 1.5;
  let xmin = Math.min(...X) - pad, xmax = Math.max(...X) + pad;
  let ymin = Math.min(...Y) - pad, ymax = Math.max(...Y) + pad;
  const W = 700, H = 560, m = 34;
  const s = Math.min((W - 2 * m) / (xmax - xmin), (H - 2 * m) / (ymax - ymin));
  const xc = (xmin + xmax) / 2, yc = (ymin + ymax) / 2;
  xmin = xc - (W - 2 * m) / (2 * s); xmax = xc + (W - 2 * m) / (2 * s);
  ymin = yc - (H - 2 * m) / (2 * s); ymax = yc + (H - 2 * m) / (2 * s);
  const px = x => m + (x - xmin) * s, py = y => H - m - (y - ymin) * s;

  const svg = document.getElementById('plot');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };

  // clip
  const defs = el('defs', {}); const cp = el('clipPath', { id: 'clip' }, defs);
  el('rect', { x: m, y: m, width: W - 2 * m, height: H - 2 * m }, cp);

  // grid + ticks
  const gGrid = el('g', {});
  const step = 5;
  for (let v = Math.ceil(xmin / step) * step; v <= xmax; v += step) {
    el('line', { x1: px(v), x2: px(v), y1: m, y2: H - m, stroke: 'var(--grid)' }, gGrid);
    const t = el('text', { x: px(v), y: H - m + 16, 'text-anchor': 'middle' }, gGrid); t.textContent = v; }
  for (let v = Math.ceil(ymin / step) * step; v <= ymax; v += step) {
    el('line', { x1: m, x2: W - m, y1: py(v), y2: py(v), stroke: 'var(--grid)' }, gGrid);
    const t = el('text', { x: m - 6, y: py(v) + 4, 'text-anchor': 'end' }, gGrid); t.textContent = v; }
  if (xmin < 0 && xmax > 0) el('line', { x1: px(0), x2: px(0), y1: m, y2: H - m, stroke: 'var(--axis)' }, gGrid);
  if (ymin < 0 && ymax > 0) el('line', { x1: m, x2: W - m, y1: py(0), y2: py(0), stroke: 'var(--axis)' }, gGrid);
  const tx = el('text', { x: W - m, y: H - m - 6, 'text-anchor': 'end' }, gGrid); tx.textContent = 'x';
  const ty = el('text', { x: m + 6, y: m + 12 }, gGrid); ty.textContent = 'y';

  const gSq = el('g', { 'clip-path': 'url(#clip)' });
  const gRes = el('g', { 'clip-path': 'url(#clip)' });
  const olsLine = el('line', { stroke: 'var(--ols)', 'stroke-width': 2.5, 'stroke-dasharray': '8 6',
    'clip-path': 'url(#clip)', visibility: 'hidden' });
  const userLine = el('line', { stroke: 'var(--line)', 'stroke-width': 2.5, 'clip-path': 'url(#clip)' });
  const gPts = el('g', {});
  const sqs = [], res = [];
  for (let i = 0; i < n; i++) {
    sqs.push(el('rect', { 'fill-opacity': 0.12, 'stroke-opacity': 0.35 }, gSq));
    res.push(el('line', { 'stroke-width': 2 }, gRes));
    el('circle', { cx: px(X[i]), cy: py(Y[i]), r: 5.5, fill: 'var(--point)',
      stroke: 'var(--bg)', 'stroke-width': 1.5 }, gPts);
  }
  olsLine.setAttribute('x1', px(xmin)); olsLine.setAttribute('x2', px(xmax));
  olsLine.setAttribute('y1', py(aOls + bOls * xmin)); olsLine.setAttribute('y2', py(aOls + bOls * xmax));

  // ---- UI ----
  const $ = id => document.getElementById(id);
  const b0 = $('b0'), b1 = $('b1'), showSq = $('showSq'), showOls = $('showOls');
  const fmt = (v, d) => v.toFixed(d).replace('.', ',').replace('-', '−');
  $('olsbox').innerHTML = `Droite MCO : ŷ = ${fmt(aOls, 1)} + ${fmt(bOls, 1)}·x<br>` +
    `SCR minimale = ${fmt(sseOls, 2)}`;

  function update() {
    const a = parseInt(b0.value, 10) / 10, b = parseInt(b1.value, 10) / 10;
    const S = sse(a, b);
    const good = S - gridMin < 1e-9;       // lowest SSE reachable with the sliders
    const col = good ? 'var(--good)' : 'var(--bad)';
    $('b0v').textContent = fmt(a, 1); $('b1v').textContent = fmt(b, 1);
    $('eq').textContent = `ŷ = ${fmt(a, 1)} ${b < 0 ? '−' : '+'} ${fmt(Math.abs(b), 1)}·x`;
    const se = $('sse'); se.textContent = fmt(S, 2); se.classList.toggle('good', good);

    userLine.setAttribute('x1', px(xmin)); userLine.setAttribute('x2', px(xmax));
    userLine.setAttribute('y1', py(a + b * xmin)); userLine.setAttribute('y2', py(a + b * xmax));
    userLine.setAttribute('stroke', good ? 'var(--good)' : 'var(--line)');

    for (let i = 0; i < n; i++) {
      const yh = a + b * X[i], e = Y[i] - yh, side = Math.abs(e) * s;
      res[i].setAttribute('x1', px(X[i])); res[i].setAttribute('x2', px(X[i]));
      res[i].setAttribute('y1', py(Y[i])); res[i].setAttribute('y2', py(yh));
      res[i].setAttribute('stroke', col);
      // square with the residual as one side, drawn to the right of the point
      sqs[i].setAttribute('x', px(X[i])); sqs[i].setAttribute('y', Math.min(py(Y[i]), py(yh)));
      sqs[i].setAttribute('width', side); sqs[i].setAttribute('height', side);
      sqs[i].setAttribute('fill', col); sqs[i].setAttribute('stroke', col);
    }
    gSq.setAttribute('visibility', showSq.checked ? 'visible' : 'hidden');

    // meter: log scale between the grid minimum and a bad fit
    const frac = Math.max(0, Math.min(1, Math.log(S / gridMin) / Math.log(sseMax / gridMin)));
    $('meter').firstElementChild.style.width = (100 * (1 - frac)).toFixed(1) + '%';
    $('meter').classList.toggle('good', good);
    $('meterlab').textContent = good ? 'Qualité de l’ajustement : optimale'
      : `Encore ${fmt(S - gridMin, 2)} au-dessus du minimum atteignable`;
    $('msg').innerHTML = good
      ? '<b style="color:var(--good)">Bravo !</b> Aucune autre combinaison des curseurs ne donne une SCR plus petite.'
      : 'Déplacez les curseurs pour réduire la SCR.';
  }

  [b0, b1, showSq].forEach(e => e.addEventListener('input', update));
  showOls.addEventListener('change', () => {
    olsLine.setAttribute('visibility', showOls.checked ? 'visible' : 'hidden');
    $('olsbox').hidden = !showOls.checked; });
  $('reset').addEventListener('click', () => { b0.value = 5; b1.value = -10;
    showOls.checked = false; olsLine.setAttribute('visibility', 'hidden');
    $('olsbox').hidden = true; update(); });
  update();
})();
</script>
</body>
</html>
